worker_processes 8;
events {
    worker_connections 128;
}
http {
    include  /etc/nginx/mime-types.conf;

    log_format main '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log main;

	client_max_body_size 150M;

	gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_types text/plain text/html text/css text/xml text/javascript application/x-javascript application/xml application/json image/svg+xml image/jpeg image/png image/webp;
    gzip_disable "MSIE [1-6]\.";
    gzip_comp_level 5;

    add_header Service-Worker-Allowed "/";

    keepalive_timeout 30;
    keepalive_requests 100;

    # Redirect to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name lac.local;
        return 301 https://$host$request_uri;
    }

		server {
	        listen 443 ssl;
	        listen [::]:443 ssl;

			server_name lac.local;

	        http2 on;

		root /var/www/;

        ssl_session_cache shared:SSL:2m;
        ssl_session_timeout 5m;
        ssl_buffer_size 4k;

		ssl_certificate /etc/nginx/ssl/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/private/nginx-selfsigned.key;

			index index.php;
			charset utf-8;

		error_page 404 /index.php;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;

        location /stub_status {
            stub_status;
            allow all;
        }

        location /hls {
            add_header Cache-Control no-cache;
            # CORS setup
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length';

            # allow CORS preflight requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            types {
                application/dash+xml mpd;
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp/;
        }

		location /events {
            proxy_pass http://php:8080/events;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

		location /assets/ {
			include  /etc/nginx/mime-types.conf;
        	autoindex on;
        	expires 30d;
            sendfile           on;
            tcp_nopush on;
            sendfile_max_chunk 1m;
            add_header Cache-Control "public, no-transform";
    		add_header Service-Worker-Allowed "/";
        }

		location /dist/ {
			include  /etc/nginx/mime-types.conf;
		    gzip_static on;
        	autoindex on;
            sendfile           on;
            tcp_nopush on;
            sendfile_max_chunk 1m;
        	expires 30d;
            add_header Cache-Control "public, no-transform";
    		add_header Service-Worker-Allowed "/";
        }

		location / {
			try_files $uri /index.php?$query_string;
			}

		location ~ \.php$ {
			index index.php;
			fastcgi_pass php:9000;
			include /etc/nginx/fastcgi_params.conf;
			fastcgi_intercept_errors  off;

			}
	}
}
